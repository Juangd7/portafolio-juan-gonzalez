<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Juan González</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .error-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem var(--side);
      position: relative;
      overflow: hidden;
    }
    .error-num {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: clamp(7rem, 22vw, 16rem);
      line-height: 0.9;
      color: var(--accent);
      letter-spacing: -0.04em;
      margin: 0;
      opacity: 0.15;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }
    .error-content {
      position: relative;
      z-index: 1;
      max-width: 540px;
    }
    .error-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
    }
    .error-title {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.1;
      margin-bottom: 1.2rem;
      color: var(--text);
    }
    .error-desc {
      color: var(--text2);
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
      line-height: 1.65;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
<nav class="navbar" id="navbar">
  <a href="/" class="nav-logo" aria-label="Inicio">
    <img src="/assets/img/logo-j-amarillo.svg" alt="JEGD" class="nav-logo-img nav-logo-dark">
    <img src="/assets/img/logo-j.svg" alt="JEGD" class="nav-logo-img nav-logo-light">
  </a>
  <ul class="nav-links" id="nav-links">
    <li><a href="/" data-es="Inicio" data-en="Home">Inicio</a></li>
    <li><a href="/proyectos/" data-es="Proyectos" data-en="Work">Proyectos</a></li>
    <li><a href="/sobre-mi/" data-es="Sobre mí" data-en="About">Sobre mí</a></li>
    <li><a href="/contacto/" data-es="Contacto" data-en="Contact">Contacto</a></li>
  </ul>
  <div class="nav-controls">
    <button class="btn-lang" id="btn-lang">EN</button>
    <button class="btn-theme" id="btn-theme">☀ Claro</button>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menú"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="error-page">
  <div class="error-num" aria-hidden="true">404</div>
  <div class="error-content reveal">
    <p class="error-label" data-es="Página no encontrada" data-en="Page not found">Página no encontrada</p>
    <h1 class="error-title" data-es="Ups. Esta página no existe." data-en="Oops. This page doesn't exist.">Ups. Esta página no existe.</h1>
    <p class="error-desc" data-es="Parece que el enlace está roto o la página fue movida. Pero mi portafolio sigue aquí, esperándote." data-en="Looks like the link is broken or the page was moved. But my portfolio is still here, waiting for you.">Parece que el enlace está roto o la página fue movida. Pero mi portafolio sigue aquí, esperándote.</p>
    <div class="error-actions">
      <a href="/" class="btn-primary" data-es="← Volver al inicio" data-en="← Back to home">← Volver al inicio</a>
      <a href="/proyectos/" class="btn-outline" data-es="Ver proyectos" data-en="See projects">Ver proyectos</a>
    </div>
  </div>
</div>

<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>
<script src="/assets/js/main.js"></script>
</body>
</html>
